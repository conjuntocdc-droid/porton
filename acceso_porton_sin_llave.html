<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Prueba de apertura del portón</title>
<style>
  :root{
    --panel: #ffffff;
    --panel-2: #f4fffd;
    --brass: #0d9488;
    --brass-light: #2dd4bf;
    --accent: #fb923c;
    --accent-light: #fdba74;
    --ok: #16a34a;
    --err: #e11d48;
    --text: #114240;
    --text-dim: #5b8481;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background: linear-gradient(160deg, #cffafe 0%, #ecfeff 35%, #fff7ed 75%, #ffedd5 100%);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    color:var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100dvh;
    padding:24px;
  }
  .plate{
    width:100%;
    max-width:360px;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border-radius:28px;
    padding:32px 26px 28px;
    box-shadow:
      0 30px 60px -20px rgba(13,148,136,0.25),
      inset 0 1px 0 rgba(255,255,255,0.6),
      inset 0 0 0 1px rgba(13,148,136,0.06);
    position:relative;
  }
  .screw{ position:absolute; width:8px;height:8px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #99f6e4, #5eead4);
    box-shadow: inset 0 0 2px rgba(13,148,136,0.3); }
  .screw.tl{top:14px;left:14px;} .screw.tr{top:14px;right:14px;}
  .screw.bl{bottom:14px;left:14px;} .screw.br{bottom:14px;right:14px;}

  .eyebrow{ text-transform:uppercase; letter-spacing:.22em; font-size:11px;
    color:var(--text-dim); text-align:center; margin-bottom:6px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  h1{ text-align:center; font-size:22px; font-weight:400; margin:0 0 8px;
    color:var(--brass); }
  .aviso{ text-align:center; font-size:13px; color:var(--accent); margin:0 0 24px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight:600; }

  #loginView input{ width:100%; padding:13px 14px; margin-bottom:12px;
    border-radius:10px; border:1px solid #b2e5e0; background:#f4fffd;
    color:var(--text); font-size:15px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  #loginView input:focus{ outline:none; border-color:var(--brass); }
  #loginView button{ width:100%; padding:13px; border:none; border-radius:10px;
    background: linear-gradient(180deg, var(--brass-light), var(--brass));
    color:#ffffff; font-weight:700; font-size:14px; letter-spacing:.05em;
    text-transform:uppercase; cursor:pointer;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  #loginView button:disabled{ opacity:.6; }

  .btn-wrap{ display:flex; justify-content:center; margin: 10px 0 24px; }
  button.open{
    width:180px;height:180px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    position:relative;
    background: linear-gradient(180deg, var(--accent-light), var(--accent));
    color:#ffffff;
    box-shadow:
      0 14px 24px -8px rgba(251,146,60,0.4),
      0 2px 0 rgba(0,0,0,0.08),
      inset 0 2px 3px rgba(255,255,255,0.4),
      inset 0 -8px 14px rgba(0,0,0,0.12);
    transition: transform .08s ease, box-shadow .08s ease;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight:700; font-size:15px; letter-spacing:.05em; text-transform:uppercase;
  }
  button.open:active{ transform: translateY(3px) scale(0.98); }
  button.open:disabled{ filter: grayscale(0.4) brightness(1.05) opacity(0.55); cursor:default; }

  .status{ text-align:center; min-height:20px; font-size:13px; color:var(--text-dim);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin-bottom:4px; }
  .status.ok{ color: var(--ok); } .status.err{ color: var(--err); }

  .hidden{ display:none !important; }

  .foot{ margin-top:20px; text-align:center; font-size:11px; color:var(--text-dim);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .foot button{ background:none;border:none;color:var(--brass); text-decoration:underline;
    cursor:pointer; font-size:11px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
</style>
</head>
<body>

<div class="plate">
  <div class="screw tl"></div><div class="screw tr"></div>
  <div class="screw bl"></div><div class="screw br"></div>

  <div class="eyebrow">Acceso sin llavero</div>
  <h1>Abrir el portón</h1>
  <p class="aviso">Para cuando olvidaste tu llave electrónica</p>

  <div id="loginView">
    <input type="email" id="email" placeholder="Correo" autocomplete="username">
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btnLogin" onclick="iniciarSesion()">Iniciar sesión</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <div id="appView" class="hidden">
    <div class="btn-wrap">
      <button class="open" id="btnAbrir" onclick="abrirPuertaAccion()">Abrir / Cerrar</button>
    </div>
    <div class="status" id="statusAbrir">Listo para probar</div>
  </div>

  <div class="foot">
    <span id="footText">Acceso remoto</span>
    <div id="logoutWrap" class="hidden" style="margin-top:8px;">
      <button onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  // ---------- CONFIGURACION ----------
  const firebaseConfig = {
      apiKey: "AIzaSyBZvCqMqAFsX4TKTPuORKAIJNHoyI8W39s",
      authDomain: "appconjunto.firebaseapp.com",
      databaseURL: "https://appconjunto-default-rtdb.firebaseio.com",
      projectId: "appconjunto",
      storageBucket: "appconjunto.firebasestorage.app",
      messagingSenderId: "515436870267",
      appId: "1:515436870267:web:b2b137ff610be7206480de"
  };

  const TOKEN_SECRETO = "porton82X6KVMKLJTmBFs9ddYjpsGWn"; // igual al de las reglas de Firebase y al main.py
  // ------------------------------------

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  const loginView = document.getElementById('loginView');
  const appView = document.getElementById('appView');
  const logoutWrap = document.getElementById('logoutWrap');
  const loginStatus = document.getElementById('loginStatus');
  const btnAbrir = document.getElementById('btnAbrir');
  const statusAbrir = document.getElementById('statusAbrir');

  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

  auth.onAuthStateChanged((user) => {
    if (user) {
      loginView.classList.add('hidden');
      appView.classList.remove('hidden');
      logoutWrap.classList.remove('hidden');
    } else {
      loginView.classList.remove('hidden');
      appView.classList.add('hidden');
      logoutWrap.classList.add('hidden');
    }
  });

  async function iniciarSesion(){
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value;
    const btnLogin = document.getElementById('btnLogin');
    if (!email || !pass) {
      loginStatus.className = 'status err';
      loginStatus.textContent = 'Ingresa correo y contraseña';
      return;
    }
    btnLogin.disabled = true;
    loginStatus.className = 'status';
    loginStatus.textContent = 'Verificando...';
    try {
      await auth.signInWithEmailAndPassword(email, pass);
      loginStatus.textContent = '';
    } catch (e) {
      loginStatus.className = 'status err';
      loginStatus.textContent = 'Correo o contraseña incorrectos';
    } finally {
      btnLogin.disabled = false;
    }
  }

  function cerrarSesion(){ auth.signOut(); }

  async function abrirPuertaAccion(){
    const user = auth.currentUser;
    if (!user || btnAbrir.disabled) return;

    btnAbrir.disabled = true;
    statusAbrir.className = 'status';
    statusAbrir.textContent = 'Enviando acción...';

    const solicitadoEn = Date.now();

    try {
      // accionSolicitada se envia como "desconocida" ya que en este modo de
      // prueba no se toma foto -- el ESP32 de todas formas decide la accion
      // real (accionAplicada) con una lectura fresca del sensor, no depende
      // de este campo para funcionar.
      await db.ref(TOKEN_SECRETO + '/SolicitudAccionPuerta').set({
        usuario: user.email,
        solicitado_en: solicitadoEn,
        accionSolicitada: 'desconocida'
      });
      statusAbrir.textContent = 'Esperando confirmación del portón...';
      escucharConfirmacionAccion(solicitadoEn);
    } catch (e) {
      statusAbrir.className = 'status err';
      statusAbrir.textContent = 'Error al enviar la acción';
      btnAbrir.disabled = false;
    }
  }

  function escucharConfirmacionAccion(solicitadoEn){
    const ref = db.ref(TOKEN_SECRETO + '/UltimaAccionPuerta');
    const cb = (snap) => {
      const val = snap.val();
      if (val && val.solicitado_en === solicitadoEn) {
        if (val.resultado === 'ok') {
          statusAbrir.className = 'status ok';
          statusAbrir.textContent = 'Listo: se ' + (val.accionAplicada === 'abrir' ? 'abrió' : 'cerró') + ' el portón';
        } else if (val.resultado === 'bloqueado_seguridad') {
          statusAbrir.className = 'status err';
          statusAbrir.textContent = 'No se accionó: hubo otra acción hace muy poco. Espera unos segundos.';
        } else if (val.resultado === 'vencido') {
          statusAbrir.className = 'status err';
          statusAbrir.textContent = 'La solicitud tardó demasiado y fue descartada. Intenta de nuevo.';
        }
        ref.off('value', cb);
        btnAbrir.disabled = false;
      }
    };
    ref.on('value', cb);

    setTimeout(() => {
      ref.off('value', cb);
      btnAbrir.disabled = false;
    }, 15000);
  }
</script>

</body>
</html>
